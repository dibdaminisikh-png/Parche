# Example only. Replace domains/certificates and configure trusted identity upstream.
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    client_max_body_size 12m;
    location /assets/ { alias /srv/taropood/dist/client/assets/; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /images/ { alias /srv/taropood/dist/client/images/; add_header Cache-Control "public, max-age=86400"; }
    location /fonts/ { alias /srv/taropood/dist/client/fonts/; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Do not forward user-provided identity headers. Authentication adapter must verify sessions.
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
    }
}
